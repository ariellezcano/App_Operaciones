<div class="login-container">
  <div class="login-card shadow-lg">
    <div class="text-center mb-4">
      <img
        src="assets/img/escudo.png"
        class="logo"
        alt="Escudo Policía del Chaco"
      />

      <h2 class="mt-3">Sistema de Gestión</h2>

      <p class="text-muted">Ingrese sus credenciales para continuar</p>
    </div>

    <form (ngSubmit)="login()">
      <!-- USUARIO -->
      <div class="mb-3">
        <label class="form-label"> Usuario </label>

        <div class="input-group">
          <span class="input-group-text">
            <i class="bi bi-person-fill"></i>
          </span>

          <input
            type="text"
            class="form-control"
            name="usuario"
            [(ngModel)]="usuario"
            placeholder="Ingrese su usuario"
            autocomplete="username"
            required
          />
        </div>
      </div>

      <!-- PASSWORD -->
      <div class="mb-4">
        <label class="form-label"> Contraseña </label>

        <div class="input-group">
          <span class="input-group-text">
            <i class="bi bi-lock-fill"></i>
          </span>

          <input
            [type]="mostrarPassword ? 'text' : 'password'"
            class="form-control"
            name="password"
            [(ngModel)]="password"
            placeholder="Ingrese su contraseña"
            autocomplete="current-password"
            (keyup.enter)="login()"
            required
          />

          <button
            type="button"
            class="btn btn-outline-secondary"
            (click)="verPassword()"
          >
            <i
              class="bi"
              [ngClass]="mostrarPassword ? 'bi-eye-slash-fill' : 'bi-eye-fill'"
            >
            </i>
          </button>
        </div>
      </div>

      <!-- BOTÓN LOGIN -->
      <button
        type="submit"
        class="btn btn-primary w-100 btn-lg"
        [disabled]="cargando"
      >
        <span *ngIf="cargando" class="spinner-border spinner-border-sm me-2">
        </span>

        <i *ngIf="!cargando" class="bi bi-box-arrow-in-right me-2"> </i>

        {{ cargando ? "Ingresando..." : "Iniciar Sesión" }}
      </button>
    </form>

    <hr class="my-4" />

    <div class="text-center">
      <small class="text-muted d-block">
        División Operaciones Policiales Interior Villa Angela
      </small>

      <small class="text-muted"> Policía del Chaco </small>
    </div>
  </div>
</div>
