<div class="card shadow-sm border-0 mb-4">

    <div class="card-header bg-primary text-white">
      <h5 class="mb-0">
        <i class="bi bi-funnel-fill me-2"></i>
        Filtro de Localidades
      </h5>
    </div>
  
    <div class="card-body">
  
      <form (ngSubmit)="filter()">
  
        <div class="row align-items-end">
  
          <!-- Nombre -->
          <div class="col-md-8 mb-3">
            <label class="form-label fw-semibold">
              Nombre de la localidad
            </label>
  
            <input
              type="text"
              class="form-control"
              placeholder="Ingrese el nombre de la localidad..."
              [(ngModel)]="busqueda"
              name="busqueda">
          </div>
  
          <!-- Cantidad de registros -->
          <div class="col-md-2 mb-3">
            <label class="form-label fw-semibold">
              Registros
            </label>
  
            <select
              class="form-select"
              [(ngModel)]="limit"
              name="limit"
              (change)="filter()">
  
              <option *ngFor="let item of limits" [value]="item">
                {{ item }}
              </option>
  
            </select>
          </div>
  
          <!-- Botones -->
          <div class="col-md-2 mb-3 d-grid gap-2">
  
            <button
              type="submit"
              class="btn btn-primary">
              <i class="bi bi-search me-1"></i>
              Buscar
            </button>
  
            <button
              type="button"
              class="btn btn-outline-secondary"
              (click)="busqueda=''; paginaActual=1; filter();">
  
              <i class="bi bi-arrow-clockwise me-1"></i>
              Limpiar
  
            </button>
  
          </div>
  
        </div>
  
      </form>
  
      <!-- Información de la búsqueda -->
      <div class="d-flex justify-content-between align-items-center mt-3">
  
        <small class="text-muted">
          Total de registros:
          <strong>{{ totalRegistros }}</strong>
        </small>
  
        <small class="text-muted">
          Página {{ paginaActual }} de {{ totalPaginas }}
        </small>
  
      </div>
      <div class="d-flex justify-content-end mt-3">

        <nav>
    
            <ul class="pagination mb-0">
    
                <li
                    class="page-item"
                    [class.disabled]="paginaActual <= 1">
    
                    <button
                        class="page-link"
                        (click)="setPage(paginaActual,'anterior')">
    
                        <i class="bi bi-chevron-left"></i>
    
                    </button>
    
                </li>
    
                <li class="page-item disabled">
    
                    <span class="page-link">
    
                        {{paginaActual}} / {{totalPaginas}}
    
                    </span>
    
                </li>
    
                <li
                    class="page-item"
                    [class.disabled]="paginaActual >= totalPaginas">
    
                    <button
                        class="page-link"
                        (click)="setPage(paginaActual,'siguiente')">
    
                        <i class="bi bi-chevron-right"></i>
    
                    </button>
    
                </li>
    
            </ul>
    
        </nav>
    
    </div>
    </div>
  
  </div>
