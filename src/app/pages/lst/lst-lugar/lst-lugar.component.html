<div class="container-fluid my-5 px-5">
  <div class="card shadow-lg border-0 rounded-4 overflow-hidden">
    <!-- HEADER -->
    <div
      class="card-header d-flex justify-content-between align-items-center py-3"
      style="background: linear-gradient(90deg, #0d6efd, #0b5ed7); color: #fff"
    >
      <h3 class="m-0 fw-bold d-flex align-items-center">
        <i class="bi bi-geo-alt-fill me-2"></i>
        Listado de Lugares
      </h3>

      <button class="btn btn-light fw-semibold shadow-sm" (click)="nuevo()">
        <i class="bi bi-plus-circle-fill me-2 text-primary"></i>
        Nuevo Lugar
      </button>
    </div>

    <!-- BODY -->
    <div class="card-body bg-light py-4">
      <app-fil-lugar (emmit)="doFound($event)"> </app-fil-lugar>

      <div class="table-responsive bg-white shadow-sm rounded-3">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-primary text-center">
            <tr>
              <th style="width: 120px">Código</th>
              <th class="text-start">Nombre</th>
              <!-- <th style="width: 120px">Estado</th> -->
              <th style="width: 180px">Acciones</th>
            </tr>
          </thead>

          <tbody>
            <tr *ngFor="let item of items">
              <td class="text-center fw-semibold">
                {{ item.idLugar }}
              </td>

              <td>
                {{ item.nombre }}
              </td>

              <!-- <td class="text-center">
                <span
                  class="badge px-3 py-2"
                  [class.bg-success]="item.activo"
                  [class.bg-danger]="!item.activo"
                >
                  {{ item.activo ? "Activo" : "Inactivo" }}
                </span>
              </td> -->

              <td class="text-center">
                <div class="btn-group" role="group">
                  <button
                    class="btn btn-warning btn-sm"
                    title="Editar"
                    (click)="editar(item.idLugar)"
                  >
                    <i class="bi bi-pencil-square"></i>
                  </button>

                  <button
                    class="btn btn-danger btn-sm"
                    title="Eliminar"
                    (click)="eliminar(item.idLugar)"
                  >
                    <i class="bi bi-trash-fill"></i>
                  </button>
                </div>
              </td>
            </tr>

            <tr *ngIf="items.length === 0">
              <td colspan="4" class="text-center py-5">
                <i class="bi bi-geo-alt fs-1 text-secondary d-block mb-2"></i>

                <h5 class="text-secondary">No se encontraron lugares</h5>

                <p class="text-muted mb-0">
                  Intente modificar los filtros de búsqueda.
                </p>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- FOOTER -->
    <div
      class="card-footer text-end text-muted small bg-white border-top fw-semibold py-3"
    >
      Total: {{ items.length }} registros
    </div>
  </div>
</div>
