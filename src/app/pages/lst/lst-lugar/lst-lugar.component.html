<div class="container-fluid my-5 px-5">

    <div class="card shadow-lg border-0 rounded-4 overflow-hidden">
  
      <!-- HEADER -->
      <div class="card-header bg-primary text-white py-3">
        <h3 class="m-0 fw-bold d-flex align-items-center">
          <i class="bi bi-geo-alt-fill me-2"></i>
          Listado de Lugares
        </h3>
      </div>
  
      <!-- BODY -->
      <div class="card-body bg-light py-4">
  
        <app-fil-lugar
          (emmit)="doFound($event)">
        </app-fil-lugar>
  
        <div class="table-responsive bg-white shadow-sm rounded-3">
  
          <table class="table table-hover mb-0">
  
            <thead class="table-primary text-center">
              <tr>
                <th>Código</th>
                <th>Nombre</th>
                <th>Activo</th>
              </tr>
            </thead>
  
            <tbody>
  
              <tr *ngFor="let item of items">
  
                <td class="text-center">
                  {{ item.idLugar }}
                </td>
  
                <td>
                  {{ item.nombre }}
                </td>
  
                <td class="text-center">
                  <span class="badge"
                        [class.bg-success]="item.activo"
                        [class.bg-danger]="!item.activo">
                    {{ item.activo ? 'SI' : 'NO' }}
                  </span>
                </td>
  
              </tr>
  
              <tr *ngIf="items.length === 0">
                <td colspan="3" class="text-center py-5 text-muted">
                  No se encontraron lugares
                </td>
              </tr>
  
            </tbody>
  
          </table>
  
        </div>
  
      </div>
  
      <div class="card-footer text-end small text-muted">
        Total: {{ items.length }} registros
      </div>
  
    </div>
  
  </div>
